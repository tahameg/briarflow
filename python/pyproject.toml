[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "briarflow"
version = "0.1.0"
description = "Python SDK for Briarflow: write nodes in Python and serve them to a Briarflow engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/briarflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
